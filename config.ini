; ============================================================
; InfiniteDesk config. Lies next to InfiniteDesk.exe.
; Recreated with defaults if deleted. Bookmarks are saved here on exit.
; ============================================================

[Camera]
; Zoom limits (scale 1.0 = 1:1 pixels)
MinScale=0.05
MaxScale=2.0
; Multiplier per one wheel notch
ZoomStep=1.12
; Camera fly animation duration, ms (zoom-to-fit / home / bookmarks / center)
FlyDurationMs=350

[Input]
; Pan friction: higher = canvas stops faster (1/s)
InertiaFriction=4.0
; Minimal flick speed to start inertia, virtual px/s
InertiaMinSpeed=120

[Snap]
Enabled=1
; Snap capture distance, screen px
SnapDistance=16
; Hysteresis: release distance = SnapDistance * ReleaseFactor
ReleaseFactor=1.8
; Gap between snapped windows, virtual px
Gap=0

[Render]
; Target FPS of the canvas/input loop (see README: real windows are repainted by DWM)
TargetFPS=240
; Grid spacing in virtual px at scale 1
GridStep=96
; Colors AARRGGBB
BackgroundColor=FF1A1B26
GridDotColor=FF2F3347
; Draw user wallpaper at home viewport (0 = flat color only)
DrawWallpaper=1

[Preview]
; Live WGC previews of windows when zoomed out (stretch feature)
Enabled=1
; Below this scale real windows are parked and replaced by live previews
BelowScale=0.45
; Hysteresis on return
AboveScale=0.55

[Debug]
ShowFps=0

[Hotkeys]
; Format: [Ctrl+][Alt+][Shift+][Win+]Key
; Key: A..Z, 0..9, F1..F24, Home, End, Left, Right, Up, Down, Space, Tab, Esc
ZoomToFit=Ctrl+Alt+W
Home=Ctrl+Alt+Home
CenterWindow=Ctrl+Alt+C
ResetZoom=Ctrl+Alt+0
ToggleFps=Ctrl+Alt+F
Exit=Ctrl+Alt+Q
Bookmark1=Ctrl+Alt+1
Bookmark2=Ctrl+Alt+2
Bookmark3=Ctrl+Alt+3
Bookmark4=Ctrl+Alt+4
SaveBookmark1=Ctrl+Alt+Shift+1
SaveBookmark2=Ctrl+Alt+Shift+2
SaveBookmark3=Ctrl+Alt+Shift+3
SaveBookmark4=Ctrl+Alt+Shift+4

[Bookmarks]
; Saved automatically: Slot1=offsetX,offsetY,scale
